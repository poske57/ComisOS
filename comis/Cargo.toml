[package]
name = "comis"
version = "0.1.0"
edition = "2024"

[dependencies]
dialoguer = "0.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
codegen-units = 1
strip = true
